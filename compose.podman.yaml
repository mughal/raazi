# Apply after compose.production.yaml in the same root/rootless Podman context as Aigate.
services:
  app:
    image: localhost/raazi:${RAAZI_IMAGE_TAG:-local}
    pull_policy: never
    env_file:
      - ${RAAZI_ENV_FILE:-.env.qa}
    networks:
      default: {}
      inference:
        ipv4_address: ${RAAZI_APP_IP:-192.168.10.40}
  vectors:
    pull_policy: never
    networks:
      default: {}
      inference:
        ipv4_address: ${RAAZI_POSTGRES_IP:-192.168.10.41}
networks:
  inference:
    external: true
    name: ${INFERENCE_NETWORK:-podnet10}
