services:
  vectors:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: raazi_vectors
      POSTGRES_USER: raazi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - raazi_vectors:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raazi -d raazi_vectors"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  raazi_vectors:
